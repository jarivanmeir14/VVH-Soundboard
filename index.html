<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VVH Soundboard">
<title>VV Horebeke Stadium Soundboard</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{margin:0;background:#0b0b0b;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%} body{padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}.app{max-width:720px;margin:auto;text-align:center}.brand{font-weight:950;letter-spacing:.06em;font-size:clamp(24px,7vw,44px);margin:8px 0 2px}.sub{color:#aaa;font-size:14px;margin-bottom:18px}.status{border:1px solid #333;border-radius:14px;padding:12px;margin-bottom:14px;background:#151515;font-weight:800;min-height:48px;display:flex;align-items:center;justify-content:center}.grid{display:grid;gap:14px}.pad{border:0;border-radius:22px;min-height:150px;padding:20px;font:inherit;font-weight:950;font-size:clamp(25px,8vw,48px);cursor:pointer;touch-action:manipulation;transition:transform .08s ease,filter .08s ease,box-shadow .08s ease;box-shadow:0 8px 0 rgba(0,0,0,.45)}.pad:active,.pad.pressed{transform:translateY(7px) scale(.985);box-shadow:0 1px 0 rgba(0,0,0,.45);filter:brightness(.8)}.opkomst{background:#ffe600;color:#0a0a0a}.goal{background:#fff;color:#0a0a0a;border:5px solid #ffe600}.stop{background:#b21f2d;color:white;min-height:82px;font-size:25px}.playing{outline:5px solid #45d36b;outline-offset:3px}.controls{margin-top:16px;background:#151515;border:1px solid #333;border-radius:16px;padding:14px;text-align:left}.controls label{font-size:14px;font-weight:800;display:flex;justify-content:space-between;margin-bottom:9px}.controls input{width:100%}.hint{color:#8f8f8f;font-size:12px;line-height:1.45;margin-top:12px}.error{color:#ff8c8c}.ok{color:#7ee89a}@media(min-width:650px){.grid{grid-template-columns:1fr 1fr}.stop{grid-column:1/-1}}
</style>
</head>
<body>
<main class="app">
  <div class="brand">VV HOREBEKE</div>
  <div class="sub">STADIUM SOUNDBOARD</div>
  <div id="status" class="status" aria-live="polite">Klaar voor de aftrap</div>
  <div class="grid">
    <button id="opkomstBtn" class="pad opkomst" type="button">🏟️<br>OPKOMST</button>
    <button id="goalBtn" class="pad goal" type="button">⚽<br>GOOOOAL!</button>
    <button id="stopBtn" class="pad stop" type="button">■ STOP ALLES</button>
  </div>
  <div class="controls">
    <label for="volume"><span>🔊 Volume</span><span id="volText">100%</span></label>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="1">
  </div>
  <div class="hint">Tik rechtstreeks op een knop om het nummer te starten. Een nieuw nummer stopt automatisch het vorige.</div>
</main>
<audio id="opkomstAudio" preload="auto" playsinline src="opkomst.mp3"></audio>
<audio id="goalAudio" preload="auto" playsinline src="goal.mp3"></audio>
<script>
(() => {
  const opkomst = document.getElementById('opkomstAudio');
  const goal = document.getElementById('goalAudio');
  const opkomstBtn = document.getElementById('opkomstBtn');
  const goalBtn = document.getElementById('goalBtn');
  const stopBtn = document.getElementById('stopBtn');
  const status = document.getElementById('status');
  const volume = document.getElementById('volume');
  const volText = document.getElementById('volText');
  const tracks = [opkomst, goal];
  const buttons = [opkomstBtn, goalBtn];

  function press(btn){ btn.classList.add('pressed'); setTimeout(()=>btn.classList.remove('pressed'),140); }
  function clearPlaying(){ buttons.forEach(b=>b.classList.remove('playing')); }
  function stopAll(reset=true){ tracks.forEach(a=>{a.pause(); if(reset){try{a.currentTime=0}catch(e){}}}); clearPlaying(); }
  async function playTrack(audio, btn, label){
    press(btn); stopAll(true); audio.volume = Number(volume.value);
    status.className='status'; status.textContent='Laden…';
    try{
      await audio.play();
      btn.classList.add('playing');
      status.className='status ok'; status.textContent='▶ SPEELT: '+label;
    }catch(err){
      status.className='status error';
      status.textContent='Geen audio: open deze pagina in Safari/Chrome via het webadres en controleer of stiltemodus/volume uit staat.';
    }
  }
  opkomstBtn.addEventListener('click',()=>playTrack(opkomst,opkomstBtn,'Losing Control'));
  goalBtn.addEventListener('click',()=>playTrack(goal,goalBtn,'Liberté'));
  stopBtn.addEventListener('click',()=>{press(stopBtn);stopAll(true);status.className='status';status.textContent='■ GESTOPT';});
  volume.addEventListener('input',()=>{const v=Number(volume.value);tracks.forEach(a=>a.volume=v);volText.textContent=Math.round(v*100)+'%';});
  tracks.forEach(a=>a.addEventListener('ended',()=>{clearPlaying();status.className='status';status.textContent='Klaar';}));
  document.addEventListener('keydown',e=>{
    if(e.repeat) return;
    if(e.key==='1'||e.key==='F1'){e.preventDefault();playTrack(opkomst,opkomstBtn,'Losing Control');}
    if(e.key==='2'||e.key==='F2'){e.preventDefault();playTrack(goal,goalBtn,'Liberté');}
    if(e.key==='0'||e.key==='Escape'){e.preventDefault();stopBtn.click();}
  });
})();
</script>
</body>
</html>
